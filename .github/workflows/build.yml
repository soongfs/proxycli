name: build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build binary
        run: |
          pyinstaller --onefile --name proxycli \
            --collect-all proxycli \
            src/proxycli/main.py
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Smoke test binary
        run: |
          dist/proxycli --help >/dev/null
          dist/proxycli --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxycli-${{ matrix.target }}
          path: dist/proxycli*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: proxycli-*
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
